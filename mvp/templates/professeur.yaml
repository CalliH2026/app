narrations:
  - "Je suis François, dans le rôle du professeur. J’ouvre la copie d’Alex pour préparer mon rendez-vous avec ses parents."
  - "Parallèle travaille pendant que je poursuis mes cours. Le compteur montre onze appels réels à six outils, avec leurs résultats."
  - "La capsule est prête, avec audio et sous-titres. Je la relis avant de décider de la partager avec la famille."
  - "Cette démonstration rejoue une exécution réelle sur des données fictives. Je garde les preuves, le rapport et la décision finale."
